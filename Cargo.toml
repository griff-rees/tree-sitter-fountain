[package]
name = "tree-sitter-fountain"
description = "A markup syntax for screenplays."
version = "0.3.2"
authors = ["Dr Griffith Rees <info@box3spool5.org>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "fountain"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/griff-rees/tree-sitter-fountain"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.25"
