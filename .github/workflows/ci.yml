name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Verify generated parser is in sync with grammar.js
        run: |
          pnpm exec tree-sitter generate
          git diff --exit-code -- src
      - name: Run corpus tests
        run: pnpm exec tree-sitter test
      - name: Parse example screenplays
        run: pnpm exec tree-sitter parse examples/*.fountain --quiet --stat
      - name: Run node binding tests
        run: pnpm test
